name: Validate workshop

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate workshop
        shell: bash
        run: bash tests/validate-workshop.sh

      - name: Validate workflow YAML syntax
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check --quiet PyYAML==6.0.2
          python3 tests/test-workflow-yaml.py

      - name: Build runner image
        shell: bash
        run: |
          docker build --tag workshop-runner-validation ./runner
          docker run --rm --entrypoint bash workshop-runner-validation -c '
            set -euo pipefail
            ! id -nG | grep -Eq "(^| )(sudo|docker)( |$)"
            ! sudo -n true >/dev/null 2>&1
            test "$(stat -c %U:%G /home/runner/entrypoint.sh)" = "root:root"
            test ! -w /home/runner/entrypoint.sh
            test "$(az extension show --name containerapp --query version --output tsv)" = "0.3.55"
          '
