name: Validate workshop

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate workshop
        shell: bash
        run: bash tests/validate-workshop.sh

      - name: Validate workflow YAML syntax
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check --quiet PyYAML==6.0.2
          python3 tests/test-workflow-yaml.py

      - name: Build runner image
        shell: bash
        run: |
          docker build --tag workshop-runner-validation ./runner
          test "$(docker inspect --format '{{.Config.User}}' workshop-runner-validation)" = "root"
          docker run --rm --entrypoint bash workshop-runner-validation -c '
            set -euo pipefail
            command -v openssl >/dev/null
            command -v runuser >/dev/null
            command -v ps >/dev/null
            test "$(stat -c %U:%G /home/runner/entrypoint.sh)" = "root:root"
            test "$(stat -c %a /home/runner/entrypoint.sh)" = "555"
            runuser --preserve-environment -u runner -- \
              test ! -w /home/runner/entrypoint.sh
            ! id -nG runner | grep -Eq "(^| )(sudo|docker)( |$)"
            test "$(runuser --preserve-environment -u runner -- id -un)" = "runner"
            test "$(runuser --preserve-environment -u runner -- \
              az extension show --name containerapp --query version --output tsv)" = "0.3.55"
          '
